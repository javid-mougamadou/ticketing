services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"
    # Bind-mount seulement le code source (pas static/dist ni staticfiles,
    # générés au build Docker -- un volume anonyme resterait périmé d'un
    # rebuild à l'autre, contrairement à un répertoire simplement absent
    # du bind-mount).
    volumes:
      - ./manage.py:/app/manage.py
      - ./config:/app/config
      - ./tickets:/app/tickets
      - ./templates:/app/templates
      - ./static/src:/app/static/src

volumes:
  pgdata:
