{% extends "base.html" %}

{% block title %}New ticket{% endblock %}

{% block content %}
<h1 class="mb-6 text-2xl font-bold">New ticket</h1>
<form method="post" class="max-w-xl space-y-4">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700">
    Create
  </button>
</form>
{% endblock %}
