<div id="status-panel" class="mb-8 rounded-md border border-slate-200 p-4">
  <p class="mb-3 text-sm font-medium">Status: <span class="font-bold">{{ ticket.get_status_display }}</span></p>
  <div class="flex flex-wrap gap-2">
    {% for value, label in status_choices %}
    <button
      hx-post="{% url 'tickets:ticket_update_status' ticket.pk %}"
      hx-vals='{"status": "{{ value }}"}'
      hx-target="#status-panel"
      hx-swap="outerHTML"
      class="rounded-md border px-3 py-1 text-sm {% if ticket.status == value %}bg-slate-900 text-white{% else %}bg-white text-slate-700 hover:bg-slate-100{% endif %}"
    >{{ label }}</button>
    {% endfor %}
  </div>
  {% if ticket.status_history.all %}
  <ul class="mt-4 space-y-1 text-xs text-slate-500">
    {% for entry in ticket.status_history.all %}
    <li>{{ entry.created_date }} — {{ entry.old_status }} → {{ entry.new_status }}</li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
