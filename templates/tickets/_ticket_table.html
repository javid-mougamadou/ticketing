<div id="ticket-table">
  <table class="w-full divide-y divide-slate-200 text-sm">
    <thead>
      <tr class="text-left">
        <th class="py-2">#</th>
        <th>Title</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Category</th>
        <th>Comments</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-100">
      {% for ticket in tickets %}
      <tr>
        <td class="py-2">
          <a href="{% url 'tickets:ticket_detail' ticket.pk %}" class="text-blue-600 hover:underline">#{{ ticket.id }}</a>
        </td>
        <td><a href="{% url 'tickets:ticket_detail' ticket.pk %}" class="hover:underline">{{ ticket.title }}</a></td>
        <td>{{ ticket.get_status_display }}</td>
        <td>{{ ticket.get_priority_display }}</td>
        <td>{{ ticket.category.name|default:"—" }}</td>
        <td>{{ ticket.comment_count }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="6" class="py-4 text-center text-slate-500">No tickets found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
